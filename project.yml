name: MacAudit
options:
  bundleIdPrefix: org.afaik
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "0.0.7"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AuditKit:
    path: AuditKit
targets:
  MacAudit:
    type: application
    platform: macOS
    sources:
      - path: MacAudit
      - path: MacAuditHelper/org.afaik.MacAudit.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: AuditKit
        product: AuditKit
      - target: MacAuditHelper
        embed: true
        codeSign: false
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.afaik.MacAudit
        PRODUCT_NAME: MacAudit
        DEVELOPMENT_TEAM: R4J8ZNC9HF
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: MacAudit
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
  MacAuditHelper:
    type: tool
    platform: macOS
    sources:
      - path: MacAuditHelper
        excludes: ["*.plist"]
    dependencies:
      - package: AuditKit
        product: AuditKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.afaik.MacAudit.helper
        PRODUCT_NAME: MacAuditHelper
        DEVELOPMENT_TEAM: R4J8ZNC9HF
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
